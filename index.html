<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Echoes - Prototype v2</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a24;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background-color: #2d2b38;
        }
        #ui-layer {
            position: absolute;
            top: 15px;
            left: 15px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .bar-container {
            width: 200px;
            height: 16px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.1s linear;
        }
        #hp-bar { background: #ff4757; }
        #energy-bar { background: #1e90ff; }
        #controls-info {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 13px;
            pointer-events: none;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="ui-layer">
        <div>HP</div>
        <div class="bar-container"><div id="hp-bar" class="bar-fill"></div></div>
        <div>에너지</div>
        <div class="bar-container"><div id="energy-bar" class="bar-fill"></div></div>
        <div id="wave-status" style="margin-top: 5px; font-weight: bold; color: #2ed573;">
            웨이브 리스폰 대기 중...
        </div>
        <div id="color-status" style="margin-top: 2px; font-weight: bold; color: #ff4757;">
            현재 물감: Red [단축키 1, 2, 3]
        </div>
    </div>

    <div id="controls-info">
        🎮 <b>조작법</b><br>
        - <b>이동:</b> W, A, S, D<br>
        - <b>일반 공격:</b> 마우스 좌클릭 (붓 휘두르기 모션)<br>
        - <b>대시/회피:</b> Space<br>
        - <b>물감 변경:</b> 숫자키 1(Red), 2(Yellow), 3(Blue)
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const COLOR_TYPES = {
    RED: { name: 'Red', color: '#ff4757', damage: 35, range: 45, energyCost: 10, desc: '공격력↑ 사거리↓' },
    YELLOW: { name: 'Yellow', color: '#ffa502', damage: 15, range: 85, slowEffect: true, energyCost: 15, desc: '사거리↑ 명중시 슬로우' },
    BLUE: { name: 'Blue', color: '#1e90ff', damage: 20, range: 60, energyCost: 5, desc: '균형 잡힌 물감' }
};

const keys = {};
let mousePos = { x: 0, y: 0 };

const player = {
    x: 400,
    y: 300,
    radius: 16,
    speed: 4,
    maxHp: 100,
    hp: 100,
    maxEnergy: 100,
    energy: 100,
    currentColor: COLOR_TYPES.RED,
    isDashing: false,
    dashTimer: 0,
    dashSpeed: 10,
    invincible: false,
    invincibleTimer: 0,
    // 공격 모션용 변수
    isAttacking: false,
    attackAnimTimer: 0,
    attackAngle: 0
};

const attackParticles = [];
let enemies = [];
let gameTime = 0;
let respawnTimer = 0;

// 적 종류 정의 (3가지 타입)
const ENEMY_TYPES = {
    SLIME: { name: '슬라이미', radius: 16, hp: 40, speed: 1.8, color: '#2ed573', type: 'slime' },
    RUNNER: { name: '러너', radius: 12, hp: 25, speed: 3.0, color: '#ffa502', type: 'runner' },
    TANK: { name: '탱크', radius: 24, hp: 100, speed: 0.9, color: '#a55eea', type: 'tank' }
};

// 웨이브별 적 소환 함수
function spawnWave() {
    enemies = [];
    // 슬라이미 3마리
    for(let i=0; i<3; i++) {
        createRandomEnemy(ENEMY_TYPES.SLIME);
    }
    // 러너 2마리
    for(let i=0; i<2; i++) {
        createRandomEnemy(ENEMY_TYPES.RUNNER);
    }
    // 탱크 1마리
    createRandomEnemy(ENEMY_TYPES.TANK);
}

function createRandomEnemy(enemyProto) {
    // 플레이어와 일정 거리 이상 떨어진 곳에 스폰
    let x, y, dist;
    do {
        x = Math.random() * (canvas.width - 100) + 50;
        y = Math.random() * (canvas.height - 100) + 50;
        dist = Math.hypot(x - player.x, y - player.y);
    } while (dist < 200);

    enemies.push({
        x: x,
        y: y,
        radius: enemyProto.radius,
        hp: enemyProto.hp,
        maxHp: enemyProto.hp,
        speed: enemyProto.speed,
        color: enemyProto.color,
        type: enemyProto.type,
        slowTimer: 0
    });
}

// 최초 적 소환
spawnWave();

// --- 이벤트 리스너 ---
window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key === '1') setPlayerColor(COLOR_TYPES.RED);
    if (e.key === '2') setPlayerColor(COLOR_TYPES.YELLOW);
    if (e.key === '3') setPlayerColor(COLOR_TYPES.BLUE);
    if (e.code === 'Space') performDash();
});

window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mousePos.x = e.clientX - rect.left;
    mousePos.y = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', e => {
    if (e.button === 0) performAttack();
});

function setPlayerColor(colorType) {
    player.currentColor = colorType;
    document.getElementById('color-status').style.color = colorType.color;
    document.getElementById('color-status').innerText = `현재 물감: ${colorType.name} (${colorType.desc}) [단축키 1, 2, 3]`;
}

function performDash() {
    if (player.isDashing || player.energy < 15) return;
    player.energy -= 15;
    player.isDashing = true;
    player.dashTimer = 10;
    player.invincible = true;
    player.invincibleTimer = 15;
}

// 공격 함수 (모션 트리거 포함)
function performAttack() {
    if (player.isAttacking) return; // 공격 중 중복 입력 방지
    
    const angle = Math.atan2(mousePos.y - player.y, mousePos.x - player.x);
    
    // 공격 모션 상태 활성화
    player.isAttacking = true;
    player.attackAnimTimer = 10; // 10프레임 동안 휘두르기 모션 재생
    player.attackAngle = angle;

    // 공격 파티클 효과 생성
    attackParticles.push({
        x: player.x,
        y: player.y,
        angle: angle,
        color: player.currentColor.color,
        range: player.currentColor.range,
        life: 10,
        maxLife: 10,
        damage: player.currentColor.damage,
        isSlow: player.currentColor.slowEffect || false
    });

    // 적 타격 판정
    enemies.forEach(enemy => {
        const dx = enemy.x - player.x;
        const dy = enemy.y - player.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        
        if (dist <= player.currentColor.range + enemy.radius) {
            const targetAngle = Math.atan2(dy, dx);
            let angleDiff = Math.abs(angle - targetAngle);
            if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;

            if (angleDiff < Math.PI / 3) {
                enemy.hp -= player.currentColor.damage;
                player.energy = Math.min(player.maxEnergy, player.energy + 5);
                
                if (player.currentColor.slowEffect) {
                    enemy.slowTimer = 60;
                }
            }
        }
    });
}

function update() {
    gameTime++;

    // 공격 모션 타이머 처리
    if (player.isAttacking) {
        player.attackAnimTimer--;
        if (player.attackAnimTimer <= 0) {
            player.isAttacking = false;
        }
    }

    // 플레이어 이동
    let moveX = 0;
    let moveY = 0;
    if (keys['w'] || keys['ㅈ']) moveY -= 1;
    if (keys['s'] || keys['ㄴ']) moveY += 1;
    if (keys['a'] || keys['ㅁ']) moveX -= 1;
    if (keys['d'] || keys['ㅇ']) moveX += 1;

    let currentSpeed = player.speed;
    if (player.isDashing) {
        currentSpeed = player.dashSpeed;
        player.dashTimer--;
        if (player.dashTimer <= 0) player.isDashing = false;
    }

    if (moveX !== 0 || moveY !== 0) {
        const length = Math.sqrt(moveX * moveX + moveY * moveY);
        player.x += (moveX / length) * currentSpeed;
        player.y += (moveY / length) * currentSpeed;
    }

    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

    if (player.invincible) {
        player.invincibleTimer--;
        if (player.invincibleTimer <= 0) player.invincible = false;
    }

    // 적 업데이트 및 리스폰 관리
    for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];

        if (enemy.hp <= 0) {
            enemies.splice(i, 1);
            continue;
        }

        let speed = enemy.speed;
        if (enemy.slowTimer > 0) {
            speed *= 0.4;
            enemy.slowTimer--;
        }

        const dx = player.x - enemy.x;
        const dy = player.y - enemy.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > 0) {
            enemy.x += (dx / dist) * speed;
            enemy.y += (dy / dist) * speed;
        }

        if (dist < player.radius + enemy.radius && !player.invincible) {
            player.hp = Math.max(0, player.hp - 10);
            player.invincible = true;
            player.invincibleTimer = 30;
        }
    }

    // 모든 적을 처치했을 경우 리스폰 타이머 작동
    const waveStatus = document.getElementById('wave-status');
    if (enemies.length === 0) {
        respawnTimer++;
        waveStatus.innerText = `모든 적 처치! ${Math.ceil((120 - respawnTimer) / 60)}초 후 리스폰...`;
        if (respawnTimer >= 120) { // 약 2초 후 리스폰
            spawnWave();
            respawnTimer = 0;
            waveStatus.innerText = "새로운 웨이브 시작!";
        }
    } else {
        waveStatus.innerText = `남은 적 수: ${enemies.length}마리`;
    }

    document.getElementById('hp-bar').style.width = `${(player.hp / player.maxHp) * 100}%`;
    document.getElementById('energy-bar').style.width = `${(player.energy / player.maxEnergy) * 100}%`;
}

function draw() {
    ctx.fillStyle = '#2d2b38';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 격자선
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // 적 그리기
    enemies.forEach(enemy => {
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
        ctx.fillStyle = enemy.slowTimer > 0 ? '#70a1ff' : enemy.color;
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // 적 타입별 이름 표시
        ctx.fillStyle = '#fff';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(enemy.type.toUpperCase(), enemy.x, enemy.y - enemy.radius - 6);

        // 적 HP 바
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(enemy.x - 15, enemy.y - enemy.radius - 18, 30, 4);
        ctx.fillStyle = '#ff4757';
        ctx.fillRect(enemy.x - 15, enemy.y - enemy.radius - 18, (enemy.hp / enemy.maxHp) * 30, 4);
    });

    // 공격 이펙트
    for (let i = attackParticles.length - 1; i >= 0; i--) {
        const p = attackParticles[i];
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.arc(p.x, p.y, p.range, p.angle - Math.PI / 3, p.angle + Math.PI / 3);
        ctx.closePath();
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / p.maxLife * 0.5;
        ctx.fill();
        ctx.restore();

        p.life--;
        if (p.life <= 0) attackParticles.splice(i, 1);
    }

    // 플레이어 그리기
    ctx.save();
    if (player.invincible && Math.floor(gameTime / 4) % 2 === 0) {
        ctx.globalAlpha = 0.4;
    }

    // 본체
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#f1c40f';
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 공격 모션 (붓 휘두르는 애니메이션 효과)
    let brushDist = 18;
    let brushAngleOffset = 0;
    
    if (player.isAttacking) {
        // 공격할 때 앞으로 휙 휘둘러지는 모션 계산
        const progress = (10 - player.attackAnimTimer) / 10;
        brushAngleOffset = (Math.sin(progress * Math.PI) * 0.8) - 0.4;
        brushDist = 26; // 공격 시 붓이 살짝 앞으로 뻗어나감
    }

    const mouseAngle = Math.atan2(mousePos.y - player.y, mousePos.x - player.x);
    const finalBrushAngle = mouseAngle + brushAngleOffset;
    const brushX = player.x + Math.cos(finalBrushAngle) * brushDist;
    const brushY = player.y + Math.sin(finalBrushAngle) * brushDist;
    
    ctx.beginPath();
    ctx.arc(brushX, brushY, player.isAttacking ? 8 : 6, 0, Math.PI * 2);
    ctx.fillStyle = player.currentColor.color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>

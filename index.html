<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Echoes - Prototype v3.1</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a24;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background-color: #2d2b38;
        }
        #ui-layer {
            position: absolute;
            top: 15px;
            left: 15px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .bar-container {
            width: 200px;
            height: 16px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.1s linear;
        }
        #hp-bar { background: #ff4757; }
        #energy-bar { background: #1e90ff; }
        #controls-info {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 13px;
            pointer-events: none;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="ui-layer">
        <div>HP</div>
        <div class="bar-container"><div id="hp-bar" class="bar-fill"></div></div>
        <div>에너지</div>
        <div class="bar-container"><div id="energy-bar" class="bar-fill"></div></div>
        <div id="wave-status" style="margin-top: 5px; font-weight: bold; color: #2ed573;">
            웨이브 리스폰 대기 중...
        </div>
        <div id="color-status" style="margin-top: 2px; font-weight: bold; color: #ff4757;">
            현재 물감: Red [단축키 1~5]
        </div>
    </div>

    <div id="controls-info">
        🎮 <b>조작법 & 신규 시스템</b><br>
        - <b>이동:</b> W, A, S, D | <b>대시:</b> Space<br>
        - <b>일반 공격:</b> 마우스 좌클릭 (연타 불가, 묵직한 모션 적용)<br>
        - <b>물감 변경:</b><br>
        &nbsp;&nbsp;1(Red: 근접 강타), 2(Yellow: 슬로우 범위), 3(Blue: 표준)<br>
        &nbsp;&nbsp;4(Purple: 직선 찌르기 + 독 데미지)<br>
        &nbsp;&nbsp;5(Orange: 반복 시 범위 커지다 마지막 원형 폭발)
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const COLOR_TYPES = {
    RED: { name: 'Red', color: '#ff4757', damage: 35, range: 50, type: 'arc' },
    YELLOW: { name: 'Yellow', color: '#ffa502', damage: 15, range: 90, slowEffect: true, type: 'arc' },
    BLUE: { name: 'Blue', color: '#1e90ff', damage: 20, range: 65, type: 'arc' },
    PURPLE: { name: 'Purple', color: '#9b59b6', damage: 25, range: 110, poison: true, type: 'stab' },
    ORANGE: { name: 'Orange', color: '#e67e22', damage: 18, range: 60, type: 'growing' }
};

const keys = {};
let mousePos = { x: 400, y: 300 };

const player = {
    x: 400,
    y: 300,
    radius: 16,
    speed: 4,
    maxHp: 100,
    hp: 100,
    maxEnergy: 100,
    energy: 100,
    currentColor: COLOR_TYPES.RED,
    isDashing: false,
    dashTimer: 0,
    dashSpeed: 10,
    invincible: false,
    invincibleTimer: 0,
    isAttacking: false,
    attackCooldown: 0,
    attackAnimTimer: 0,
    attackDuration: 18,
    attackAngle: 0,
    orangeCombo: 0
};

const attackEffects = [];
let enemies = [];
let gameTime = 0;
let respawnTimer = 0;

const ENEMY_TYPES = {
    SLIME: { radius: 16, hp: 40, speed: 1.8, color: '#2ed573', type: 'slime' },
    RUNNER: { radius: 12, hp: 25, speed: 3.0, color: '#f39c12', type: 'runner' },
    TANK: { radius: 24, hp: 110, speed: 0.85, color: '#8e44ad', type: 'tank' }
};

function spawnWave() {
    enemies = [];
    for(let i=0; i<3; i++) createRandomEnemy(ENEMY_TYPES.SLIME);
    for(let i=0; i<2; i++) createRandomEnemy(ENEMY_TYPES.RUNNER);
    createRandomEnemy(ENEMY_TYPES.TANK);
}

function createRandomEnemy(enemyProto) {
    let x, y, dist;
    do {
        x = Math.random() * (canvas.width - 100) + 50;
        y = Math.random() * (canvas.height - 100) + 50;
        dist = Math.hypot(x - player.x, y - player.y);
    } while (dist < 200);

    enemies.push({
        x: x, y: y,
        radius: enemyProto.radius,
        hp: enemyProto.hp,
        maxHp: enemyProto.hp,
        speed: enemyProto.speed,
        color: enemyProto.color,
        type: enemyProto.type,
        slowTimer: 0,
        poisonTimer: 0,
        poisonDamageTimer: 0
    });
}

spawnWave();

window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key === '1') setPlayerColor(COLOR_TYPES.RED);
    if (e.key === '2') setPlayerColor(COLOR_TYPES.YELLOW);
    if (e.key === '3') setPlayerColor(COLOR_TYPES.BLUE);
    if (e.key === '4') setPlayerColor(COLOR_TYPES.PURPLE);
    if (e.key === '5') setPlayerColor(COLOR_TYPES.ORANGE);
    if (e.code === 'Space') performDash();
});

window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mousePos.x = e.clientX - rect.left;
    mousePos.y = e.clientY - rect.top;
});

canvas.addEventListener('mousedown', e => {
    if (e.button === 0) performAttack();
});

function setPlayerColor(colorType) {
    if (player.currentColor !== colorType) {
        player.orangeCombo = 0;
    }
    player.currentColor = colorType;
    document.getElementById('color-status').style.color = colorType.color;
    document.getElementById('color-status').innerText = `현재 물감: ${colorType.name} [단축키 1~5]`;
}

function performDash() {
    if (player.isDashing || player.energy < 15) return;
    player.energy -= 15;
    player.isDashing = true;
    player.dashTimer = 10;
    player.invincible = true;
    player.invincibleTimer = 15;
}

function performAttack() {
    if (player.isAttacking || player.attackCooldown > 0) return;

    const angle = Math.atan2(mousePos.y - player.y, mousePos.x - player.x);
    
    player.isAttacking = true;
    player.attackAnimTimer = player.attackDuration;
    player.attackCooldown = player.attackDuration + 8;
    player.attackAngle = angle;

    let currentRange = player.currentColor.range;
    let attackType = player.currentColor.type;
    let isExplosion = false;

    if (player.currentColor === COLOR_TYPES.ORANGE) {
        player.orangeCombo++;
        if (player.orangeCombo >= 4) {
            isExplosion = true;
            currentRange = 100;
            player.orangeCombo = 0;
        } else {
            currentRange += (player.orangeCombo * 20);
        }
    } else {
        player.orangeCombo = 0;
    }

    attackEffects.push({
        x: player.x,
        y: player.y,
        angle: angle,
        color: player.currentColor.color,
        range: currentRange,
        life: player.attackDuration,
        maxLife: player.attackDuration,
        type: attackType,
        isExplosion: isExplosion
    });

    enemies.forEach(enemy => {
        const dx = enemy.x - player.x;
        const dy = enemy.y - player.y;
        const dist = Math.hypot(dx, dy);

        if (attackType === 'stab') {
            const targetAngle = Math.atan2(dy, dx);
            let angleDiff = Math.abs(angle - targetAngle);
            if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;

            if (dist <= currentRange + enemy.radius && angleDiff < Math.PI / 6) {
                enemy.hp -= player.currentColor.damage;
                enemy.poisonTimer = 180;
                player.energy = Math.min(player.maxEnergy, player.energy + 8);
            }
        } else if (isExplosion) {
            if (dist <= currentRange + enemy.radius) {
                enemy.hp -= player.currentColor.damage * 1.8;
                player.energy = Math.min(player.maxEnergy, player.energy + 10);
            }
        } else {
            if (dist <= currentRange + enemy.radius) {
                const targetAngle = Math.atan2(dy, dx);
                let angleDiff = Math.abs(angle - targetAngle);
                if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;

                if (angleDiff < Math.PI / 3) {
                    enemy.hp -= player.currentColor.damage;
                    player.energy = Math.min(player.maxEnergy, player.energy + 5);
                    if (player.currentColor.slowEffect) enemy.slowTimer = 60;
                }
            }
        }
    });
}

function update() {
    gameTime++;

    if (player.attackCooldown > 0) player.attackCooldown--;
    if (player.isAttacking) {
        player.attackAnimTimer--;
        if (player.attackAnimTimer <= 0) player.isAttacking = false;
    }

    let moveX = 0;
    let moveY = 0;
    if (keys['w'] || keys['ㅈ']) moveY -= 1;
    if (keys['s'] || keys['ㄴ']) moveY += 1;
    if (keys['a'] || keys['ㅁ']) moveX -= 1;
    if (keys['d'] || keys['ㅇ']) moveX += 1;

    let currentSpeed = player.speed;
    if (player.isDashing) {
        currentSpeed = player.dashSpeed;
        player.dashTimer--;
        if (player.dashTimer <= 0) player.isDashing = false;
    }

    if (moveX !== 0 || moveY !== 0) {
        const length = Math.hypot(moveX, moveY);
        player.x += (moveX / length) * currentSpeed;
        player.y += (moveY / length) * currentSpeed;
    }

    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

    if (player.invincible) {
        player.invincibleTimer--;
        if (player.invincibleTimer <= 0) player.invincible = false;
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];

        if (enemy.hp <= 0) {
            enemies.splice(i, 1);
            continue;
        }

        if (enemy.poisonTimer > 0) {
            enemy.poisonTimer--;
            enemy.poisonDamageTimer++;
            if (enemy.poisonDamageTimer >= 30) {
                enemy.hp -= 5;
                enemy.poisonDamageTimer = 0;
            }
        }

        let speed = enemy.speed;
        if (enemy.slowTimer > 0) {
            speed *= 0.4;
            enemy.slowTimer--;
        }

        const dx = player.x - enemy.x;
        const dy = player.y - enemy.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 0) {
            enemy.x += (dx / dist) * speed;
            enemy.y += (dy / dist) * speed;
        }

        if (dist < player.radius + enemy.radius && !player.invincible) {
            player.hp = Math.max(0, player.hp - 10);
            player.invincible = true;
            player.invincibleTimer = 30;
        }
    }

    const waveStatus = document.getElementById('wave-status');
    if (enemies.length === 0) {
        respawnTimer++;
        waveStatus.innerText = `모든 적 처치! ${Math.ceil((120 - respawnTimer) / 60)}초 후 리스폰...`;
        if (respawnTimer >= 120) {
            spawnWave();
            respawnTimer = 0;
        }
    } else {
        waveStatus.innerText = `남은 적 수: ${enemies.length}마리`;
    }

    document.getElementById('hp-bar').style.width = `${(player.hp / player.maxHp) * 100}%`;
    document.getElementById('energy-bar').style.width = `${(player.energy / player.maxEnergy) * 100}%`;
}

function draw() {
    ctx.fillStyle = '#2d2b38';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    enemies.forEach(enemy => {
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
        ctx.fillStyle = enemy.poisonTimer > 0 ? '#b19cd9' : (enemy.slowTimer > 0 ? '#70a1ff' : enemy.color);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(enemy.type.toUpperCase(), enemy.x, enemy.y - enemy.radius - 6);

        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(enemy.x - 15, enemy.y - enemy.radius - 18, 30, 4);
        ctx.fillStyle = '#ff4757';
        ctx.fillRect(enemy.x - 15, enemy.y - enemy.radius - 18, (enemy.hp / enemy.maxHp) * 30, 4);
    });

    for (let i = attackEffects.length - 1; i >= 0; i--) {
        const p = attackEffects[i];
        ctx.save();
        ctx.beginPath();
        if (p.type === 'stab') {
            ctx.translate(player.x, player.y);
            ctx.rotate(p.angle);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life / p.maxLife * 0.7;
            ctx.fillRect(0, -12, p.range, 24);
        } else if (p.isExplosion) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.range, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life / p.maxLife * 0.6;
            ctx.fill();
        } else {
            ctx.moveTo(p.x, p.y);
            ctx.arc(p.x, p.y, p.range, p.angle - Math.PI / 3, p.angle + Math.PI / 3);
            ctx.closePath();
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life / p.maxLife * 0.5;
            ctx.fill();
        }
        ctx.restore();

        p.life--;
        if (p.life <= 0) attackEffects.splice(i, 1);
    }

    ctx.save();
    if (player.invincible && Math.floor(gameTime / 4) % 2 === 0) {
        ctx.globalAlpha = 0.4;
    }

    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#f1c40f';
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();

    let brushDist = 18;
    let angleOffset = 0;

    if (player.isAttacking) {
        const progress = (player.attackDuration - player.attackAnimTimer) / player.attackDuration;
        if (player.currentColor.type === 'stab') {
            brushDist = 18 + Math.sin(progress * Math.PI) * 45;
        } else {
            angleOffset = (Math.sin(progress * Math.PI) * 1.2) - 0.6;
            brushDist = 28;
        }
    }

    const activeAngle = player.isAttacking ? player.attackAngle : Math.atan2(mousePos.y - player.y, mousePos.x - player.x);
    const finalAngle = activeAngle + angleOffset;
    const brushX = player.x + Math.cos(finalAngle) * brushDist;
    const brushY = player.y + Math.sin(finalAngle) * brushDist;

    ctx.beginPath();
    ctx.arc(brushX, brushY, player.isAttacking ? 9 : 6, 0, Math.PI * 2);
    ctx.fillStyle = player.currentColor.color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Echoes - Ultimate Colors Prototype</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0; padding: 0;
            background-color: #1a1a24; color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }
        #game-container { position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 8px; overflow: hidden; }
        canvas { display: block; background-color: #2d2b38; }
        #ui-layer {
            position: absolute; top: 15px; left: 15px; pointer-events: none;
            display: flex; flex-direction: column; gap: 6px; font-size: 13px;
        }
        .bar-container {
            width: 200px; height: 14px; background: rgba(0, 0, 0, 0.6);
            border-radius: 7px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .bar-fill { height: 100%; width: 100%; transition: width 0.1s linear; }
        #hp-bar { background: #ff4757; }
        #energy-bar { background: #1e90ff; }
        #shield-bar { background: #2ecc71; width: 0%; }
        #controls-info {
            position: absolute; bottom: 15px; left: 15px;
            background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 6px;
            font-size: 12px; pointer-events: none; line-height: 1.4;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="ui-layer">
        <div>HP</div>
        <div class="bar-container"><div id="hp-bar" class="bar-fill"></div></div>
        <div>보호막 (초록 E)</div>
        <div class="bar-container"><div id="shield-bar" class="bar-fill"></div></div>
        <div>에너지</div>
        <div class="bar-container"><div id="energy-bar" class="bar-fill"></div></div>
        <div id="wave-status" style="font-weight: bold; color: #2ed573;">웨이브 리스폰 대기 중...</div>
        <div id="color-status" style="font-weight: bold; color: #ff4757;">현재 물감: 빨강 (단축키 1~6, E: 스킬)</div>
    </div>

    <div id="controls-info">
        🎮 <b>조작법 & 색상 시스템</b><br>
        - <b>이동:</b> W, A, S, D | <b>대시:</b> Space<br>
        - <b>일반 공격:</b> 마우스 좌클릭 (색상별 공속/범위 적용)<br>
        - <b>특수 스킬:</b> <b>E 키</b> (에너지 소모)<br>
        - <b>색상 교체:</b> 1(빨강), 2(주황), 3(노랑), 4(초록), 5(파랑), 6(보라)[cite: 3]
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 기획서 내용에 따른 6가지 색상 정의[cite: 3]
const COLOR_TYPES = {
    RED: { name: '빨강', color: '#ff4757', damage: 30, cooldown: 25, range: 40, type: 'small_arc' },
    ORANGE: { name: '주황', color: '#e67e22', damage: 20, cooldown: 35, range: 35, type: 'growing' },
    YELLOW: { name: '노랑', color: '#f1c40f', damage: 10, cooldown: 15, range: 50, type: 'front_circle', slow: true },
    GREEN: { name: '초록', color: '#2ecc71', damage: 45, cooldown: 60, range: 75, type: 'wide_arc', knockback: true },
    BLUE: { name: '파랑', color: '#3498db', damage: 15, cooldown: 25, range: 55, type: 'arc', multiHit: true },
    PURPLE: { name: '보라', color: '#9b59b6', damage: 35, cooldown: 40, range: 85, type: 'line', poison: true }
};

const keys = {};
let mousePos = { x: 400, y: 300 };

const player = {
    x: 400, y: 300, radius: 16, speed: 4,
    maxHp: 100, hp: 100, shield: 0,
    maxEnergy: 100, energy: 100,
    currentColor: COLOR_TYPES.RED,
    isDashing: false, dashTimer: 0, dashSpeed: 10,
    invincible: false, invincibleTimer: 0,
    attackCooldown: 0, isAttacking: false, attackAnimTimer: 0, attackAngle: 0,
    orangeCombo: 0, speedBoostTimer: 0
};

const attackEffects = [];
const projectiles = [];
let enemies = [];
let gameTime = 0;
let respawnTimer = 0;

const ENEMY_TYPES = {
    SLIME: { radius: 16, hp: 40, speed: 1.8, color: '#2ed573', type: 'slime' },
    RUNNER: { radius: 12, hp: 25, speed: 3.0, color: '#f39c12', type: 'runner' },
    TANK: { radius: 24, hp: 120, speed: 0.8, color: '#8e44ad', type: 'tank' }
};

function spawnWave() {
    enemies = [];
    for(let i=0; i<3; i++) createRandomEnemy(ENEMY_TYPES.SLIME);
    for(let i=0; i<2; i++) createRandomEnemy(ENEMY_TYPES.RUNNER);
    createRandomEnemy(ENEMY_TYPES.TANK);
}

function createRandomEnemy(proto) {
    let x, y, dist;
    do {
        x = Math.random() * (canvas.width - 100) + 50;
        y = Math.random() * (canvas.height - 100) + 50;
        dist = Math.hypot(x - player.x, y - player.y);
    } while (dist < 200);

    enemies.push({
        x: x, y: y, radius: proto.radius, hp: proto.hp, maxHp: proto.hp,
        speed: proto.speed, color: proto.color, type: proto.type,
        slowTimer: 0, burnTimer: 0, burnDamageTimer: 0, poisonTimer: 0, poisonDamageTimer: 0
    });
}

spawnWave();

window.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key === '1') setPlayerColor(COLOR_TYPES.RED);
    if (e.key === '2') setPlayerColor(COLOR_TYPES.ORANGE);
    if (e.key === '3') setPlayerColor(COLOR_TYPES.YELLOW);
    if (e.key === '4') setPlayerColor(COLOR_TYPES.GREEN);
    if (e.key === '5') setPlayerColor(COLOR_TYPES.BLUE);
    if (e.key === '6') setPlayerColor(COLOR_TYPES.PURPLE);
    if (e.key.toLowerCase() === 'e') triggerSkill();
    if (e.code === 'Space') performDash();
});

window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mousePos.x = e.clientX - rect.left;
    mousePos.y = e.clientY - rect.top;
});
canvas.addEventListener('mousedown', e => { if (e.button === 0) performAttack(); });

function setPlayerColor(colorType) {
    if (player.currentColor !== colorType) player.orangeCombo = 0;
    player.currentColor = colorType;
    document.getElementById('color-status').style.color = colorType.color;
    document.getElementById('color-status').innerText = `현재 물감: ${colorType.name} (단축키 1~6, E: 스킬)[cite: 3]`;
}

function performDash() {
    if (player.isDashing || player.energy < 15) return;
    player.energy -= 15;
    player.isDashing = true; player.dashTimer = 10;
    player.invincible = true; player.invincibleTimer = 15;
}

// 각 색상별 E키 특수 스킬 구현[cite: 3]
function triggerSkill() {
    if (player.energy < 35) return;
    player.energy -= 35;
    const angle = Math.atan2(mousePos.y - player.y, mousePos.x - player.x);

    if (player.currentColor === COLOR_TYPES.RED) {
        // 빨강 E: 넓은 부채꼴 큰 데미지 + 화상[cite: 3]
        attackEffects.push({ x: player.x, y: player.y, angle: angle, color: '#ff4757', range: 120, life: 15, maxLife: 15, type: 'wide_burn' });
        enemies.forEach(e => {
            const dist = Math.hypot(e.x - player.x, e.y - player.y);
            if (dist <= 120 + e.radius) {
                e.hp -= 50; e.burnTimer = 180;
            }
        });
    } else if (player.currentColor === COLOR_TYPES.ORANGE) {
        // 주황 E: 바라보는 방향 길게 돌진[cite: 3]
        player.x += Math.cos(angle) * 120;
        player.y += Math.sin(angle) * 120;
        enemies.forEach(e => {
            if (Math.hypot(e.x - player.x, e.y - player.y) < e.radius + 20) {
                e.hp -= 40;
            }
        });
    } else if (player.currentColor === COLOR_TYPES.YELLOW) {
        // 노랑 E: HP 회복 + 이속 증가[cite: 3]
        player.hp = Math.min(player.maxHp, player.hp + 25);
        player.speedBoostTimer = 180;
    } else if (player.currentColor === COLOR_TYPES.GREEN) {
        // 초록 E: 보호막 생성(최대체력 10%)[cite: 3]
        player.shield = player.maxHp * 0.1;
    } else if (player.currentColor === COLOR_TYPES.BLUE) {
        // 파랑 E: 다른 적에게 튀기는 물 탄환 발사[cite: 3]
        projectiles.push({ x: player.x, y: player.y, vx: Math.cos(angle)*7, vy: Math.sin(angle)*7, type: 'bounce', damage: 25 });
    } else if (player.currentColor === COLOR_TYPES.PURPLE) {
        // 보라 E: 세 갈래 독 탄환 발사[cite: 3]
        [-0.3, 0, 0.3].forEach(offset => {
            projectiles.push({ x: player.x, y: player.y, vx: Math.cos(angle+offset)*5, vy: Math.sin(angle+offset)*5, type: 'poison_bullet', damage: 25 });
        });
    }
}

function performAttack() {
    if (player.attackCooldown > 0) return;

    const angle = Math.atan2(mousePos.y - player.y, mousePos.x - player.x);
    player.attackCooldown = player.currentColor.cooldown;
    player.isAttacking = true; player.attackAnimTimer = 12; player.attackAngle = angle;

    let currentRange = player.currentColor.range;
    let attackType = player.currentColor.type;
    let isCircleExplode = false;

    // 주황색 범위 성장 메커니즘[cite: 3]
    if (player.currentColor === COLOR_TYPES.ORANGE) {
        player.orangeCombo++;
        if (player.orangeCombo >= 4) {
            isCircleExplode = true;
            currentRange = 90;
            player.orangeCombo = 0;
        } else {
            currentRange += (player.orangeCombo * 18);
        }
    } else {
        player.orangeCombo = 0;
    }

    attackEffects.push({
        x: player.x, y: player.y, angle: angle, color: player.currentColor.color,
        range: currentRange, life: 12, maxLife: 12, type: attackType, isCircleExplode: isCircleExplode
    });

    // 일반 공격 타격 판정 및 특수 효과
    enemies.forEach(enemy => {
        const dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
        
        if (attackType === 'line' || attackType === 'front_circle') {
            if (dist <= currentRange + enemy.radius) {
                applyDamageAndEffect(enemy, player.currentColor);
            }
        } else if (isCircleExplode) {
            if (dist <= currentRange + enemy.radius) {
                applyDamageAndEffect(enemy, player.currentColor, 1.5);
            }
        } else {
            const targetAngle = Math.atan2(enemy.y - player.y, enemy.x - player.x);
            let angleDiff = Math.abs(angle - targetAngle);
            if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;

            if (dist <= currentRange + enemy.radius && angleDiff < Math.PI / 3) {
                applyDamageAndEffect(enemy, player.currentColor);
                // 파랑색 연속 공격 (최대 3회 메커니즘)[cite: 3]
                if (player.currentColor.multiHit) {
                    setTimeout(() => { enemy.hp -= 10; }, 150);
                }
            }
        }
    });
}

function applyDamageAndEffect(enemy, colorData, multiplier = 1) {
    enemy.hp -= colorData.damage * multiplier;
    player.energy = Math.min(player.maxEnergy, player.energy + 5);

    if (colorData.slow) enemy.slowTimer = 60;
    if (colorData.poison) enemy.poisonTimer = 180;
    if (colorData.knockback) {
        enemy.x += Math.cos(player.attackAngle) * 35;
        enemy.y += Math.sin(player.attackAngle) * 35;
    }
}

function update() {
    gameTime++;
    if (player.attackCooldown > 0) player.attackCooldown--;
    if (player.isAttacking) {
        player.attackAnimTimer--;
        if (player.attackAnimTimer <= 0) player.isAttacking = false;
    }
    if (player.speedBoostTimer > 0) player.speedBoostTimer--;

    let moveX = 0, moveY = 0;
    if (keys['w'] || keys['ㅈ']) moveY -= 1;
    if (keys['s'] || keys['ㄴ']) moveY += 1;
    if (keys['a'] || keys['ㅁ']) moveX -= 1;
    if (keys['d'] || keys['ㅇ']) moveX += 1;

    let curSpeed = player.speed * (player.speedBoostTimer > 0 ? 1.4 : 1);
    if (player.isDashing) {
        curSpeed = player.dashSpeed; player.dashTimer--;
        if (player.dashTimer <= 0) player.isDashing = false;
    }

    if (moveX !== 0 || moveY !== 0) {
        const len = Math.hypot(moveX, moveY);
        player.x += (moveX / len) * curSpeed;
        player.y += (moveY / len) * curSpeed;
    }

    player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
    player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

    if (player.invincible) {
        player.invincibleTimer--;
        if (player.invincibleTimer <= 0) player.invincible = false;
    }

    // 투사체 업데이트
    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx; p.y += p.vy;
        
        enemies.forEach(e => {
            if (Math.hypot(e.x - p.x, e.y - p.y) < e.radius + 8) {
                e.hp -= p.damage;
                if (p.type === 'poison_bullet') e.poisonTimer = 180;
                projectiles.splice(i, 1);
            }
        });
        if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) projectiles.splice(i, 1);
    }

    // 적 상태 및 피격 처리
    for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        if (enemy.hp <= 0) { enemies.splice(i, 1); continue; }

        if (enemy.burnTimer > 0) {
            enemy.burnTimer--;
            if (gameTime % 30 === 0) enemy.hp -= 8;
        }
        if (enemy.poisonTimer > 0) {
            enemy.poisonTimer--;
            if (gameTime % 30 === 0) enemy.hp -= 6;
        }

        let speed = enemy.speed;
        if (enemy.slowTimer > 0) { speed *= 0.4; enemy.slowTimer--; }

        const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
        if (dist > 0) {
            enemy.x += ((player.x - enemy.x) / dist) * speed;
            enemy.y += ((player.y - enemy.y) / dist) * speed;
        }

        if (dist < player.radius + enemy.radius && !player.invincible) {
            if (player.shield > 0) {
                player.shield -= 15;
                if (player.shield < 0) player.shield = 0;
            } else {
                player.hp = Math.max(0, player.hp - 10);
            }
            player.invincible = true; player.invincibleTimer = 30;
        }
    }

    const waveStatus = document.getElementById('wave-status');
    if (enemies.length === 0) {
        respawnTimer++;
        waveStatus.innerText = `모든 적 처치! ${Math.ceil((120 - respawnTimer) / 60)}초 후 리스폰...`;
        if (respawnTimer >= 120) { spawnWave(); respawnTimer = 0; }
    } else {
        waveStatus.innerText = `남은 적 수: ${enemies.length}마리`;
    }

    document.getElementById('hp-bar').style.width = `${(player.hp / player.maxHp) * 100}%`;
    document.getElementById('shield-bar').style.width = `${(player.shield / player.maxHp) * 100}%`;
    document.getElementById('energy-bar').style.width = `${(player.energy / player.maxEnergy) * 100}%`;
}

function draw() {
    ctx.fillStyle = '#2d2b38';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 격자선
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
    for (let x = 0; x < canvas.width; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
    for (let y = 0; y < canvas.height; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

    // 적 그리기
    enemies.forEach(e => {
        ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fillStyle = e.burnTimer > 0 ? '#e74c3c' : (e.poisonTimer > 0 ? '#9b59b6' : e.color);
        ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
    });

    // 투사체 그리기
    projectiles.forEach(p => {
        ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#3498db'; ctx.fill();
    });

    // 공격 효과
    for (let i = attackEffects.length - 1; i >= 0; i--) {
        const p = attackEffects[i];
        ctx.save(); ctx.beginPath();
        if (p.type === 'line') {
            ctx.translate(player.x, player.y); ctx.rotate(p.angle);
            ctx.fillStyle = p.color; ctx.globalAlpha = p.life / p.maxLife * 0.7;
            ctx.fillRect(0, -10, p.range, 20);
        } else if (p.isCircleExplode || p.type === 'front_circle') {
            ctx.beginPath(); ctx.arc(p.x, p.y, p.range, 0, Math.PI * 2);
            ctx.fillStyle = p.color; ctx.globalAlpha = p.life / p.maxLife * 0.6; ctx.fill();
        } else {
            ctx.moveTo(p.x, p.y);
            ctx.arc(p.x, p.y, p.range, p.angle - Math.PI / 3, p.angle + Math.PI / 3);
            ctx.closePath(); ctx.fillStyle = p.color; ctx.globalAlpha = p.life / p.maxLife * 0.5; ctx.fill();
        }
        ctx.restore();
        p.life--; if (p.life <= 0) attackEffects.splice(i, 1);
    }

    // 플레이어 그리기
    ctx.save();
    if (player.invincible && Math.floor(gameTime / 4) % 2 === 0) ctx.globalAlpha = 0.4;
    ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.fillStyle = '#f1c40f'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

    // 보호막 오라 표시
    if (player.shield > 0) {
        ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 6, 0, Math.PI * 2);
        ctx.strokeStyle = '#2ecc71'; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.restore();
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
